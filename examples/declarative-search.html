<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebMCP Declarative API Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 1rem; }
    form { border: 1px solid #ccc; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    input, button { display: block; margin: 0.5rem 0; padding: 0.4rem; font: inherit; }
    pre { background: #f5f5f5; padding: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Declarative WebMCP Demo</h1>

  <h2>search</h2>
  <form toolname="search" id="searchForm">
    <label>Query: <input name="q" toolname-target="search.query" required></label>
    <label>Limit: <input name="limit" toolname-target="search.limit" type="number"></label>
    <button type="submit">Search</button>
  </form>

  <h2>add_to_cart</h2>
  <form toolname="add_to_cart" id="cartForm">
    <label>SKU: <input name="sku" toolname-target="add_to_cart.sku" required></label>
    <label>Quantity: <input name="qty" toolname-target="add_to_cart.qty" type="number"></label>
    <button type="submit">Add to cart</button>
  </form>

  <pre id="log"></pre>

  <script>
    // Form submit handlers — the bridge dispatches submit events but you can
    // listen on the page to observe the synthesized tool invocations.
    const log = document.getElementById('log');
    function appendLog(line) {
      log.textContent += line + '\n';
    }
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      appendLog('[search] called with: ' + JSON.stringify(data));
    });
    document.getElementById('cartForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      appendLog('[add_to_cart] called with: ' + JSON.stringify(data));
    });

    // Demonstrate dynamic form injection (MutationObserver should pick this up).
    setTimeout(() => {
      const dynForm = document.createElement('form');
      dynForm.setAttribute('toolname', 'checkout');
      dynForm.innerHTML = `
        <label>Address: <input name="address" toolname-target="checkout.address" required></label>
        <button type="submit">Checkout</button>
      `;
      document.body.appendChild(dynForm);
      dynForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        appendLog('[checkout] called with: ' + JSON.stringify(data));
      });
      appendLog('[demo] dynamically injected <form toolname="checkout">');
    }, 1500);
  </script>
</body>
</html>
